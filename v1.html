<style>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';

const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

const wrapAngle = a => { while (a > Math.PI) a -= Math.PI * 2; while (a < -Math.PI) a += Math.PI * 2; return a; };
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const rand = mulberry32(20261122);
const V3 = THREE.Vector3;

// ================== CONSTANTES DE LA CIUDAD ==================
const CELL = 46, BLOCK = 30, N = 6;              // bloques de -N..N, calles de 16 de ancho
const EDGE = (N + 0.5) * CELL + 7;               // límite exterior
const NEONS = [0x00f0ff, 0xff2bd6, 0x9d4dff, 0xff7a1a, 0x2b6bff, 0xff2a6d];

// ================== RENDER ==================
const canvas = $('game');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05010f);
scene.fog = new THREE.FogExp2(0x16062e, 0.0042);
const camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.1, 2600);
camera.position.set(0, 80, 140);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.85, 0.5, 0.28);
composer.addPass(bloom);
composer.addPass(new OutputPass());

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
});

// ================== LUCES ==================
scene.add(new THREE.HemisphereLight(0x6a48ff, 0x12002a, 0.7));
const moon = new THREE.DirectionalLight(0x8aa0ff, 0.45); moon.position.set(-100, 200, 80); scene.add(moon);
const headLight = new THREE.SpotLight(0xd8f4ff, 160, 80, 0.5, 0.7, 1.3); scene.add(headLight, headLight.target);
const glowLight = new THREE.PointLight(0x00f0ff, 22, 10, 1.6); scene.add(glowLight);
const copLightR = new THREE.PointLight(0xff1030, 0, 45, 1.4); const copLightB = new THREE.PointLight(0x1040ff, 0, 45, 1.4);
scene.add(copLightR, copLightB);
const flashLight = new THREE.PointLight(0xff8a20, 0, 70, 1.3); scene.add(flashLight);

// ================== TEXTURAS DE CANVAS ==================
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const winTex = canvasTex(256, 256, (g) => {
  g.fillStyle = '#000'; g.fillRect(0, 0, 256, 256);
  for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
    if (rand() < 0.42) { g.fillStyle = `rgba(255,255,255,${0.35 + rand() * 0.65})`; g.fillRect(x * 16 + 3, y * 16 + 4, 10, 8); }
  }
  for (let y = 0; y < 256; y += 64) { if (rand() < 0.5) { g.fillStyle = 'rgba(255,255,255,.9)'; g.fillRect(0, y + 1, 256, 2); } }
});
winTex.wrapS = winTex.wrapT = THREE.RepeatWrapping; winTex.anisotropy = 4;
const radialTex = canvasTex(128, 128, (g) => {
  const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.4, 'rgba(255,255,255,.45)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
});
const dotTex = canvasTex(64, 64, (g) => {
  const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.3, 'rgba(255,255,255,.8)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
});
const signCache = {};
function signTex(word, hex) {
  const k = word + hex; if (signCache[k]) return signCache[k];
  const col = '#' + hex.toString(16).padStart(6, '0');
  return signCache[k] = canvasTex(512, 200, (g, w, h) => {
    g.font = '900 120px Orbitron, Arial Black, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.shadowColor = col; g.shadowBlur = 30; g.strokeStyle = col; g.lineWidth = 8;
    g.strokeRect(14, 14, w - 28, h - 28);
    g.fillStyle = '#fff'; for (let i = 0; i < 3; i++) g.fillText(word, w / 2, h / 2 + 6);
  });
}

// ================== CIELO ==================
const skyGroup = new THREE.Group(); scene.add(skyGroup);
const sky = new THREE.Mesh(new THREE.SphereGeometry(1100, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { fogC: { value: scene.fog.color } },
  vertexShader: `varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `uniform vec3 fogC; varying vec3 vP;
    void main(){ float h = vP.y;
      vec3 glow = vec3(0.55,0.04,0.28), mid = vec3(0.06,0.005,0.12), top = vec3(0.004,0.0,0.015);
      vec3 c = mix(fogC, glow, smoothstep(-0.01,0.05,h));
      c = mix(c, mid, smoothstep(0.05,0.22,h));
      c = mix(c, top, smoothstep(0.22,0.7,h));
      gl_FragColor = vec4(c,1.0); }`
}));
sky.renderOrder = -10; skyGroup.add(sky);
const sun = new THREE.Mesh(new THREE.PlaneGeometry(380, 380), new THREE.MeshBasicMaterial({
  map: canvasTex(512, 512, (g) => {
    const gr = g.createLinearGradient(0, 0, 0, 512); gr.addColorStop(0, '#fff36b'); gr.addColorStop(0.5, '#ff7a3d'); gr.addColorStop(1, '#ff1f8f');
    g.fillStyle = gr; g.beginPath(); g.arc(256, 256, 250, 0, Math.PI * 2); g.fill();
    g.globalCompositeOperation = 'destination-out';
    for (let i = 0; i < 9; i++) { const y = 270 + i * 26; g.fillRect(0, y, 512, 4 + i * 1.6); }
  }), transparent: true, depthWrite: false, fog: false, color: new THREE.Color(1.6, 1.6, 1.6)
}));
sun.position.set(0, 60, -1000); sun.renderOrder = -9; skyGroup.add(sun);
{
  const n = 1400, p = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const th = Math.random() * Math.PI * 2, ph = Math.random() * 1.3 + 0.12;
    p[i * 3] = Math.cos(th) * Math.cos(ph) * 1000; p[i * 3 + 1] = Math.sin(ph) * 1000; p[i * 3 + 2] = Math.sin(th) * Math.cos(ph) * 1000;
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(p, 3));
  const stars = new THREE.Points(g, new THREE.PointsMaterial({ size: 1.7, sizeAttenuation: false, color: 0xcfc0ff, fog: false, transparent: true, opacity: 0.8, depthWrite: false }));
  stars.renderOrder = -8; skyGroup.add(stars);
}

// ================== SUELO ==================
const ground = new THREE.Mesh(new THREE.PlaneGeometry(4000, 4000), new THREE.MeshStandardMaterial({ color: 0x07050f, roughness: 0.45, metalness: 0.55 }));
ground.rotation.x = -Math.PI / 2; scene.add(ground);
const grid = new THREE.GridHelper(CELL * 44, 88, 0x9d4dff, 0x9d4dff);
grid.position.y = 0.04; grid.material.transparent = true; grid.material.opacity = 0.5; grid.material.color = new THREE.Color(1.4, 0.4, 2.2);
scene.add(grid);

// ================== CIUDAD ==================
const plazaFX = [];
{
  const bMats = NEONS.map(c => new THREE.MeshStandardMaterial({ color: 0x08070f, roughness: 0.4, metalness: 0.7, emissive: c, emissiveMap: winTex, emissiveIntensity: 1.5 }));
  const buckets = NEONS.map(() => []);
  const walks = [];
  const ePos = [], eCol = [];
  const pushEdges = (geo, color, mul) => {
    const eg = new THREE.EdgesGeometry(geo), p = eg.attributes.position.array, c = new THREE.Color(color).multiplyScalar(mul);
    for (let i = 0; i < p.length; i += 3) { ePos.push(p[i], p[i + 1], p[i + 2]); eCol.push(c.r, c.g, c.b); }
    eg.dispose();
  };
  const signWords = ['NEON', 'HOTEL', '24H', 'BAR', 'CASINO', 'CLUB', 'PIZZA', 'RAMEN', 'BANCO', 'DISCO', 'OPEN', 'SUSHI', 'MOTEL', 'ARCADE'];
  const addBuilding = (x, z, w, d, h, ci) => {
    const geo = new THREE.BoxGeometry(w, h, d), uv = geo.attributes.uv;
    const ox = Math.floor(rand() * 16) / 16, oy = Math.floor(rand() * 16) / 16;
    for (let f = 0; f < 6; f++) for (let k = 0; k < 4; k++) {
      const i = f * 4 + k;
      if (f === 2 || f === 3) { uv.setXY(i, 0.004, 0.004); continue; }
      const span = f < 2 ? d : w;
      uv.setXY(i, uv.getX(i) * span / 32 + ox, uv.getY(i) * h / 32 + oy);
    }
    geo.translate(x, h / 2 + 0.4, z);
    buckets[ci].push(geo);
    pushEdges(geo, NEONS[ci], 1.7);
    if (rand() < 0.22) {
      const word = signWords[Math.floor(rand() * signWords.length)], col = NEONS[Math.floor(rand() * NEONS.length)];
      const s = new THREE.Mesh(new THREE.PlaneGeometry(Math.min(w, d) * 0.9, Math.min(w, d) * 0.35), new THREE.MeshBasicMaterial({ map: signTex(word, col), transparent: true, side: THREE.DoubleSide, depthWrite: false, color: new THREE.Color(2.2, 2.2, 2.2) }));
      s.position.set(x, h + 0.4 + Math.min(w, d) * 0.25, z); s.rotation.y = Math.floor(rand() * 4) * Math.PI / 2;
      scene.add(s);
    }
  };
  for (let i = -N; i <= N; i++) for (let j = -N; j <= N; j++) {
    const cx = i * CELL, cz = j * CELL;
    const wg = new THREE.BoxGeometry(BLOCK, 0.4, BLOCK); wg.translate(cx, 0.2, cz); walks.push(wg);
    pushEdges(wg, 0x00f0ff, 0.9);
    const tall = Math.max(0.28, 1 - Math.hypot(i, j) / (N * 1.25));

function inBlock(x, z, m) {
  const bi = Math.round(x / CELL), bj = Math.round(z / CELL);
  if (Math.abs(bi) > N || Math.abs(bj) > N) return false;
  return Math.abs(x - bi * CELL) < BLOCK / 2 + m && Math.abs(z - bj * CELL) < BLOCK / 2 + m;
}
function los(a, b) {
  const dx = b.x - a.x, dz = b.z - a.z, n = Math.ceil(Math.hypot(dx, dz) / 3);
  for (let i = 1; i < n; i++) { const t = i / n; if (inBlock(a.x + dx * t, a.z + dz * t, 1.5)) return false; }
  return true;
}
// devuelve la velocidad de impacto y deja la normal en _n
const _n = new V3();
function collideWorld(p, v, r) {
  let hit = 0;
  const bi = Math.round(p.x / CELL), bj = Math.round(p.z / CELL);
  if (Math.abs(bi) <= N && Math.abs(bj) <= N) {
    const lx = p.x - bi * CELL, lz = p.z - bj * CELL, h = BLOCK / 2 + r;
    if (Math.abs(lx) < h && Math.abs(lz) < h) {
      const px = h - Math.abs(lx), pz = h - Math.abs(lz);
      if (px < pz) { const s = Math.sign(lx) || 1; p.x += s * px; if (v.x * s < 0) { hit = Math.abs(v.x); v.x *= -0.25; v.z *= 0.85; } _n.set(s, 0, 0); }
      else { const s = Math.sign(lz) || 1; p.z += s * pz; if (v.z * s < 0) { hit = Math.abs(v.z); v.z *= -0.25; v.x *= 0.85; } _n.set(0, 0, s); }
    }
  }
  const L = EDGE - r;
  if (p.x > L) { p.x = L; if (v.x > 0) { hit = Math.max(hit, v.x); v.x *= -0.3; } _n.set(-1, 0, 0); }
  if (p.x < -L) { p.x = -L; if (v.x < 0) { hit = Math.max(hit, -v.x); v.x *= -0.3; } _n.set(1, 0, 0); }
  if (p.z > L) { p.z = L; if (v.z > 0) { hit = Math.max(hit, v.z); v.z *= -0.3; } _n.set(0, 0, -1); }
  if (p.z < -L) { p.z = -L; if (v.z < 0) { hit = Math.max(hit, -v.z); v.z *= -0.3; } _n.set(0, 0, 1); }
  return hit;
}

function stepCar(c, ctl, P, dt) {
  const fx = Math.sin(c.h), fz = Math.cos(c.h), sx = fz, sz = -fx;
  let vf = c.vel.x * fx + c.vel.z * fz, vr = c.vel.x * sx + c.vel.z * sz;
  const v0 = vf;
  if (ctl.throttle > 0) vf += P.accel * ctl.throttle * dt * (vf < 0 ? 2.5 : 1);
  else if (ctl.throttle < 0) { if (vf > 0.5) vf -= P.brake * dt; else vf -= P.accel * 0.6 * dt; }
  else vf -= Math.sign(vf) * Math.min(Math.abs(vf), 7 * dt);
  if (ctl.handbrake) vf -= Math.sign(vf) * Math.min(Math.abs(vf), 8 * dt);
  if (vf > P.max) vf = Math.max(P.max, Math.min(vf, c.vfPrev ?? vf) - 22 * dt);

  c.vel.set(fx * vf + sx * vr, 0, fz * vf + sz * vr);
  c.pos.x += c.vel.x * dt; c.pos.z += c.vel.z * dt;
  c.vf = vf; c.vr = vr; c.vfPrev = vf;
  c.steerVis = lerp(c.steerVis, ctl.steer, Math.min(1, 10 * dt));
  c.accelVis = lerp(c.accelVis, (vf - v0) / Math.max(dt, 1e-3), Math.min(1, 5 * dt));
}
function poseCar(c, dt) {

    u.lean.rotation.z = lerp(u.lean.rotation.z, target, Math.min(1, 8 * dt || 1));

function makeTrail(color, H = 0.75, y0 = 0.45, n = 64) {
  const pts = Array.from({ length: n }, () => new V3());
  const pos = new Float32Array(n * 6), col = new Float32Array(n * 6), idx = [];
  for (let i = 0; i < n - 1; i++) { const a = i * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setAttribute('color', new THREE.BufferAttribute(col, 3)); g.setIndex(idx);
  const m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }));
  m.frustumCulled = false; scene.add(m);
  const base = new THREE.Color(color);
  return {
    reset(p) { pts.forEach(q => q.copy(p)); },
    update(p, k, c2) {
      const last = pts.pop(); last.copy(p); pts.unshift(last);
      const c = c2 || base;
      for (let i = 0; i < n; i++) {
        const a = (1 - i / n) * k, q = pts[i], o = i * 6;
        pos[o] = q.x; pos[o + 1] = y0; pos[o + 2] = q.z; pos[o + 3] = q.x; pos[o + 4] = y0 + H * (1 - i / n); pos[o + 5] = q.z;
        col[o] = c.r * a; col[o + 1] = c.g * a; col[o + 2] = c.b * a; col[o + 3] = c.r * a * 0.4; col[o + 4] = c.g * a * 0.4; col[o + 5] = c.b * a * 0.4;
      }
      g.attributes.position.needsUpdate = true; g.attributes.color.needsUpdate = true;
    }
  };
}

  const d = document.createElement('div'); d.className = 'pop'; d.textContent = text;
  d.style.left = ((_pv.x * 0.5 + 0.5) * innerWidth) + 'px'; d.style.top = ((-_pv.y * 0.5 + 0.5) * innerHeight) + 'px';
  d.style.color = color; d.style.textShadow = `0 0 8px ${color},0 0 20px ${color}`;
  $('texts').appendChild(d); setTimeout(() => d.remove(), 1250);
}
function addMoney(v, pos, color, prefix = '+$') {
  state.money += v; popText(prefix + v.toLocaleString('es-ES'), pos, color);
}

const starsEl = $('stars');
function renderStars() { starsEl.innerHTML = Array.from({ length: 5 }, (_, i) => `<b class="${i < state.wanted ? 'on' : ''}">★</b>`).join(''); }

function start() {
  sfx.ensure();
  for (const c of cops) scene.remove(c.mesh); cops.length = 0;
  clearBags();
  Object.assign(state, { running: true, over: false, paused: false, money: 0, shown: 0, bagsGot: 0, heat: 0, wanted: 1, busted: 0, nitro: 100, combo: 1, comboT: 0, time: 0, wrecked: 0, spawnT: 2.5, drift: 0 });
  player.pos.set(CELL / 2, 0, -CELL * 1.5); player.h = 0; player.vel.set(0, 0, 0); player.vf = player.vr = 0;
  player.mesh.rotation.set(0, 0, 0); player.wheelie = false;
  trails.forEach(t => t.reset(player.pos)); bikeTrail.reset(player.pos);
  for (let i = 0; i < 6; i++) spawnBag();
  camPos.set(player.pos.x, 6, player.pos.z - 14);
  $('menu').classList.add('hidden'); $('over').classList.add('hidden'); $('pause').classList.add('hidden');
  $('hud').classList.remove('hidden');
  if (isTouch) $('touch').classList.remove('hidden');
  renderStars();
  showMsg(rider ? '¡NEON RIDER!' : '¡A POR LA PASTA!', rider ? '#00f0ff' : '#39ff88', 1.8);
}
$('play').onclick = start; $('again').onclick = start;

function gameOver() {
  state.over = true; state.running = false;
  sfx.busted(); showMsg('', '#fff', 0);
  $('vignette').classList.remove('on'); $('boostfx').classList.remove('on'); $('touch').classList.add('hidden');
  const rec = state.money > state.best;
  if (rec) { state.best = state.money; try { localStorage.setItem('neonheist.best', String(state.best)); } catch (e) {} }
  const mm = Math.floor(state.time / 60), ss = String(Math.floor(state.time % 60)).padStart(2, '0');
  $('stats').innerHTML = `BOTÍN <b>$${state.money.toLocaleString('es-ES')}</b><br>BOLSAS <b>${state.bagsGot}</b> · POLIS FUERA <b>${state.wrecked}</b><br>TIEMPO <b>${mm}:${ss}</b> · NIVEL <b>${'★'.repeat(state.wanted)}</b><br>` +
    (rec ? `<span class="rec">¡NUEVO RÉCORD!</span>` : `<span style="color:var(--gold)">${bestTxt()}</span>`);
  $('bestMenu').textContent = bestTxt();
  setTimeout(() => { $('hud').classList.add('hidden'); $('over').classList.remove('hidden'); }, 1400);
}

// ================== MINIMAPA ==================
const mapC = $('map'), mg = mapC.getContext('2d');
function drawMap() {
  const W = mapC.width, S = W / 320, px = player.pos.x, pz = player.pos.z;
  mg.clearRect(0, 0, W, W); mg.save();
  mg.beginPath(); mg.arc(W / 2, W / 2, W / 2, 0, Math.PI * 2); mg.clip();
  mg.fillStyle = '#0a0320'; mg.fillRect(0, 0, W, W);
  mg.translate(W / 2, W / 2); mg.rotate(Math.PI + player.h); mg.scale(-1, 1);
  const tx = x => (x - px) * S, tz = z => (z - pz) * S;
  mg.fillStyle = '#2a1458'; mg.strokeStyle = '#7c3cff'; mg.lineWidth = 1;
  for (let i = -N; i <= N; i++) for (let j = -N; j <= N; j++) {
    const x = i * CELL, z = j * CELL; if (Math.abs(x - px) > 200 || Math.abs(z - pz) > 200) continue;
    mg.fillRect(tx(x - BLOCK / 2), tz(z - BLOCK / 2), BLOCK * S, BLOCK * S);
  }
  mg.strokeStyle = '#ff2bd6'; mg.lineWidth = 2; mg.strokeRect(tx(-EDGE), tz(-EDGE), EDGE * 2 * S, EDGE * 2 * S);
  const dot = (x, z, r, c) => { mg.fillStyle = c; mg.shadowColor = c; mg.shadowBlur = 8; mg.beginPath(); mg.arc(tx(x), tz(z), r, 0, Math.PI * 2); mg.fill(); };
  for (const b of bags) dot(b.position.x, b.position.z, b.userData.gold ? 5 : 4, b.userData.gold ? '#ffd200' : '#39ff88');
  const blink = Math.sin(state.t * 18) > 0;
  for (const c of cops) if (!c.dead) dot(c.pos.x, c.pos.z, 4, blink ? '#ff2a4d' : '#2b6bff');
  mg.restore();
  mg.save(); mg.translate(W / 2, W / 2);
  mg.fillStyle = '#00f0ff'; mg.shadowColor = '#00f0ff'; mg.shadowBlur = 10;
  mg.beginPath(); mg.moveTo(0, -8); mg.lineTo(6, 7); mg.lineTo(0, 3); mg.lineTo(-6, 7); mg.closePath(); mg.fill();
  mg.restore();
}

// ================== BUCLE ==================
const camPos = new V3(), camLook = new V3();
let camRoll = 0;
const clock = new THREE.Clock();
let hudT = 0;
function ctlFromInput() {
  return {
    throttle: (isDown('KeyW', 'ArrowUp', 'T_gas') ? 1 : 0) - (isDown('KeyS', 'ArrowDown', 'T_brake') ? 1 : 0),
    steer: (isDown('KeyD', 'ArrowRight', 'T_right') ? 1 : 0) - (isDown('KeyA', 'ArrowLeft', 'T_left') ? 1 : 0),
    handbrake: isDown('Space', 'T_drift'),
    boost: isDown('ShiftLeft', 'ShiftRight', 'T_nitro')
  };
}

function updatePlayer(dt) {
  const ctl = ctlFromInput();
  const boosting = ctl.boost && state.nitro > 1 && ctl.throttle >= 0;
  if (boosting && !wasBoost) sfx.boost();
  wasBoost = boosting;
  const B = rider ? PB : PP;
  const P = boosting ? { ...B, accel: B.accel * 2.2, max: rider ? 82 : 70 } : B;
  if (boosting) { state.nitro -= 28 * dt; ctl.throttle = 1; } else state.nitro = Math.min(100, state.nitro + 2.5 * dt);
  stepCar(player, ctl, P, dt);
  const hit = collideWorld(player.pos, player.vel, rider ? 1.4 : 2.1);
  if (hit > 10) {
    shake = Math.max(shake, Math.min(1, hit / 40));
    for (let i = 0; i < 18; i++) emit(player.pos.x - _n.x * 2.2, 0.8, player.pos.z - _n.z * 2.2, _n.x * 8 + (Math.random() - 0.5) * 14, Math.random() * 8, _n.z * 8 + (Math.random() - 0.5) * 14, 4, 3, 1.2, 0.6);
    sfx.crash(Math.min(1, hit / 40));
  }
  player.wheelie = rider && boosting && Math.abs(player.vr) < 8;
  player.wt = (player.wt || 0) + dt;
  poseCar(player, dt);
  player.isBoost = boosting;

  const fx = Math.sin(player.h), fz = Math.cos(player.h), sx = fz, sz = -fx;
  const sp = Math.abs(player.vf);
  // estelas
  const k = clamp(sp / 30, 0, 1) * (boosting ? 1.1 : 0.6);
  if (rider) {
    const kb = clamp((sp - 4) / 40, 0, 1) * (boosting ? 0.9 : 0.55);
    bikeTrail.update(new V3(player.pos.x - fx * 1.8, 0, player.pos.z - fz * 1.8), kb, boosting ? bikeBoostCol : bikeTrailCol);
    trails[0].update(player.pos, 0); trails[1].update(player.pos, 0);
  } else {
    bikeTrail.update(player.pos, 0);
    trails[0].update(new V3(player.pos.x - fx * 2.3 + sx * 0.75, 0, player.pos.z - fz * 2.3 + sz * 0.75), k, boosting ? boostCol : null);
    trails[1].update(new V3(player.pos.x - fx * 2.3 - sx * 0.75, 0, player.pos.z - fz * 2.3 - sz * 0.75), k, boosting ? boostCol : null);
  }
  // fuego del nitro
  if (boosting) for (let i = 0; i < 4; i++) {
    const s = (Math.random() - 0.5) * 1.2;
    emit(player.pos.x - fx * (rider ? 1.9 : 2.5) + sx * s * (rider ? 0.4 : 1), rider ? 1.2 : 0.7, player.pos.z - fz * 2.5 + sz * s, -fx * 18 + (Math.random() - 0.5) * 4 + player.vel.x * 0.5, Math.random() * 2, -fz * 18 + (Math.random() - 0.5) * 4 + player.vel.z * 0.5, 0.6, 2.5, 4, 0.35, 0);
  }
  // derrape
  const dr = Math.abs(player.vr);
  if (dr > 6 && sp > 12) {
    state.drift += dr * dt * 5;
    for (const s of [-1, 1]) emit(player.pos.x - fx * 1.6 + sx * s * 1.1, 0.4, player.pos.z - fz * 1.6 + sz * s * 1.1, (Math.random() - 0.5) * 3, 1 + Math.random() * 2, (Math.random() - 0.5) * 3, 1.2, 0.3, 1.6, 0.8, -1);
  } else if (state.drift > 0 && dr < 3) {
    if (state.drift > 40) { const v = Math.round(state.drift / 10) * 10; addMoney(v, player.pos, '#ff2bd6', 'DERRAPE +$'); }
    state.drift = 0;
  }
  // luces que siguen al coche
  headLight.position.set(player.pos.x + fx * 1.5, rider ? 1.8 : 2.2, player.pos.z + fz * 1.5);
  headLight.target.position.set(player.pos.x + fx * 30, 0, player.pos.z + fz * 30);
  glowLight.position.set(player.pos.x, 0.8, player.pos.z);
  glowLight.color.set(boosting ? 0xff2bd6 : 0x00f0ff);
}

function updateBags(dt) {
  let nearest = null, nd = Infinity;
  for (let i = bags.length - 1; i >= 0; i--) {
    const b = bags[i], u = b.userData; u.t += dt;
    u.inner.rotation.y += dt * 2; u.inner.position.y = 0.4 + Math.sin(u.t * 3) * 0.35;
    u.ring.scale.setScalar(1 + Math.sin(u.t * 4) * 0.12);
    const d = Math.hypot(b.position.x - player.pos.x, b.position.z - player.pos.z);
    if (state.running && d < 4.6) {
      const now = state.time;
      state.combo = (now - state.comboT < 7) ? Math.min(8, state.combo + 1) : 1; state.comboT = now;
      const v = u.value * state.combo;
      addMoney(v, b.position, u.gold ? '#ffd200' : '#39ff88', state.combo > 1 ? `x${state.combo} +$` : '+$');
      burst(new V3(b.position.x, 1.5, b.position.z), u.gold ? 90 : 50, u.gold ? 4 : 0.6, u.gold ? 3.2 : 4, u.gold ? 0.3 : 1.5, 16, 1.1, 12, 12);
      sfx.pickup(u.gold);
      state.nitro = Math.min(100, state.nitro + (u.gold ? 60 : 30));
      state.bagsGot++; state.heat += u.gold ? 2 : 1;
      scene.remove(b); bags.splice(i, 1); spawnBag();
      continue;
    }
    if (d < nd) { nd = d; nearest = b; }
  }
  if (nearest && state.running) {
    arrow.visible = true;
    arrow.position.set(player.pos.x, 3.6 + Math.sin(state.t * 5) * 0.15, player.pos.z);
    arrow.rotation.y = Math.atan2(nearest.position.x - player.pos.x, nearest.position.z - player.pos.z);
    arrow.material.color.setRGB(nearest.userData.gold ? 4 : 0.4, nearest.userData.gold ? 3 : 4, nearest.userData.gold ? 0.2 : 1.4);
  } else arrow.visible = false;
}

function updateGame(dt) {
  state.time += dt;
  updatePlayer(dt);
  // nivel de búsqueda
  state.heat += dt / 22;
  const w = Math.min(5, 1 + Math.floor(state.heat / 4));
  if (w > state.wanted) { state.wanted = w; renderStars(); showMsg('★'.repeat(w) + '  ¡MÁS POLIS!', '#ff2a4d', 1.8); sfx.level(); }
  const want = [0, 2, 3, 5, 7, 9][state.wanted];
  state.spawnT -= dt;
  const alive = cops.filter(c => !c.dead).length;
  if (alive < want && state.spawnT <= 0) { spawnCop(cops.length === 0 && state.time < 6 ? 60 : 110, 210); state.spawnT = 2.2; }
  // polis
  let near = 0, nearest = null, nd = Infinity;
  for (const c of cops) {
    updateCop(c, dt);
    if (c.dead) continue;
    const d = c.pos.distanceTo(player.pos);
    if (d < nd) { nd = d; nearest = c; }
    if (d > 300) { scene.remove(c.mesh); c.removed = true; continue; }
    const imp = carCollide(player, c, rider ? 3.1 : 3.9);
    if (imp > 5) {
      if (player.isBoost && imp > (rider ? 12 : 16)) wreckCop(c, true);
      else {
        state.busted += 0.03 + imp * 0.004; shake = Math.max(shake, Math.min(0.8, imp / 30));
        for (let i = 0; i < 16; i++) emit(player.pos.x + _n.x * 2, 1, player.pos.z + _n.z * 2, (Math.random() - 0.5) * 16, Math.random() * 7, (Math.random() - 0.5) * 16, 4, 3, 1.4, 0.5);
        sfx.crash(Math.min(1, imp / 30));
      }
    }
    if (d < 11) near++;
  }
  // choques entre polis: si van muy rápido, se destrozan
  for (let i = 0; i < cops.length; i++) for (let j = i + 1; j < cops.length; j++) {
    const a = cops[i], b = cops[j]; if (a.dead || b.dead) continue;
    const imp = carCollide(a, b, 3.9);
    if (imp > 30) { wreckCop(a, true); wreckCop(b, true); }
  }
  for (let i = cops.length - 1; i >= 0; i--) if (cops[i].removed) cops.splice(i, 1);
  // ¿te pillan?
  const sp = Math.abs(player.vf);
  if (near > 0 && sp < 12) state.busted += dt * 0.32 * near * (1 - sp / 14);
  else state.busted = Math.max(0, state.busted - dt * (near ? 0.08 : 0.22));
  state.busted = clamp(state.busted, 0, 1);
  if (state.busted >= 1) { gameOver(); }
  // combo
  if (state.combo > 1 && state.time - state.comboT > 7) state.combo = 1;
  // luces de la poli cercana
  if (nearest && nd < 90) {
    const on = Math.sin(state.t * 18 + nearest.phase) > 0;
    copLightR.position.set(nearest.pos.x - 1, 3, nearest.pos.z); copLightB.position.set(nearest.pos.x + 1, 3, nearest.pos.z);
    copLightR.intensity = on ? 260 : 0; copLightB.intensity = on ? 0 : 300;
  } else copLightR.intensity = copLightB.intensity = 0;
  sfx.update(sp, player.isBoost, nearest ? clamp(1 - nd / 140, 0, 1) : 0, state.t, true);
}

function updateCamera(dt, menu) {
  if (menu) {
    const a = state.t * 0.08;
    camera.position.set(Math.sin(a) * 170, 70 + Math.sin(state.t * 0.2) * 15, Math.cos(a) * 170);
    camera.lookAt(0, 10, 0); camera.fov = 70; camera.updateProjectionMatrix(); return;
  }
  if (state.over) {
    const a = state.t * 0.4;
    camPos.lerp(new V3(player.pos.x + Math.sin(a) * 18, 10, player.pos.z + Math.cos(a) * 18), 1 - Math.exp(-2 * dt));
    camera.position.copy(camPos); camera.lookAt(player.pos.x, 1, player.pos.z); return;
  }
  const fx = Math.sin(player.h), fz = Math.cos(player.h), sp = player.vel.length();
  const back = rider ? 4.8 + sp * 0.03 : 10.5 + sp * 0.05, up = rider ? 2.6 + sp * 0.012 : 4.3 + sp * 0.018;
  camPos.lerp(new V3(player.pos.x - fx * back, up, player.pos.z - fz * back), 1 - Math.exp(-(rider ? 16 : 7) * dt));
  camera.position.copy(camPos);
  if (shake > 0) { camera.position.x += (Math.random() - 0.5) * shake; camera.position.y += (Math.random() - 0.5) * shake; camera.position.z += (Math.random() - 0.5) * shake; shake = Math.max(0, shake - dt * 2.2); }
  camLook.set(player.pos.x + fx * 8, rider ? 1.7 : 1.3, player.pos.z + fz * 8);
  camera.lookAt(camLook);
  if (rider) { camRoll = lerp(camRoll, player.mesh.userData.lean.rotation.z * 0.18, 1 - Math.exp(-5 * dt)); camera.rotateZ(camRoll); }
  const fov = rider ? 64 + sp * 0.16 + (player.isBoost ? 12 : 0) : 70 + sp * 0.22 + (player.isBoost ? 14 : 0);
  camera.fov = lerp(camera.fov, fov, 1 - Math.exp(-4 * dt)); camera.updateProjectionMatrix();
}

function updateHUD(dt) {
  state.shown = state.shown + (state.money - state.shown) * Math.min(1, dt * 8);
  if (Math.abs(state.money - state.shown) < 1) state.shown = state.money;
  hudT -= dt; if (hudT > 0) return; hudT = 0.05;
  $('money').textContent = '$' + Math.round(state.shown).toLocaleString('es-ES');
  $('bagsInfo').textContent = `BOLSAS ${state.bagsGot}`;
  $('kmh').textContent = Math.round(Math.abs(player.vf) * 4.2);
  $('nitro').style.width = state.nitro + '%';
  $('nitroWrap').classList.toggle('boost', !!player.isBoost);
  $('boostfx').classList.toggle('on', !!player.isBoost);
  $('bust').style.width = (state.busted * 100) + '%';
  $('bustWrap').classList.toggle('show', state.busted > 0.02);
  $('vignette').classList.toggle('on', state.busted > 0.25);
  $('combo').textContent = state.combo > 1 ? `COMBO x${state.combo}` : '';
  drawMap();
}

function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05);
  if (state.paused) { composer.render(); return; }
  state.t += dt;
  const menu = !state.running && !state.over;
  if (state.running) updateGame(dt);
  else {
    for (const c of cops) updateCop(c, dt);
    for (let i = cops.length - 1; i >= 0; i--) if (cops[i].removed) cops.splice(i, 1);
    if (state.over) { player.vel.multiplyScalar(Math.exp(-3 * dt)); player.pos.addScaledVector(player.vel, dt); poseCar(player, dt); }
    sfx.update(0, false, 0, state.t, false);
  }
  updateBags(dt);
  for (const r of plazaFX) { r.rotation.x = Math.sin(state.t * 0.7) * 0.6 + Math.PI / 2; r.rotation.z += dt * 1.2; }
  flashLight.intensity *= Math.exp(-6 * dt);
  updateParticles(dt);
  updateCamera(dt, menu);
  updateRain(dt, camera.position.x, camera.position.z);
  skyGroup.position.copy(camera.position);
  if (msgTimer > 0) { msgTimer -= dt; if (msgTimer <= 0) $('msg').classList.remove('show'); }
  if (state.running) updateHUD(dt);
  composer.render();
}

// escena del menú
player.pos.set(CELL / 2, 0, 0); player.h = Math.PI / 2; poseCar(player, 0);
for (let i = 0; i < 6; i++) spawnBag();
trails.forEach(t => t.reset(player.pos)); bikeTrail.reset(player.pos);
$('vMoto').onclick = () => setVehicle(true); $('vCoche').onclick = () => setVehicle(false);
setVehicle(rider);
if (location.hash === '#dbg') window.dbg = { player, camera, state };
frame();
window.__game = { state, cops, bags, player, start };
</script>
